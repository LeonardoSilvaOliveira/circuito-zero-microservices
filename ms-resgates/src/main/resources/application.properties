spring.application.name=ms-resgates
spring.profiles.active=dev
spring.jpa.open-in-view=false

# Porta aleatória -> permite subir múltiplas instâncias (Load Balancer)
server.port=0

# ---------------------------------------------------------------- Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
# Registra a instância pelo IP (evita falha de DNS do hostname da máquina no Gateway/Feign)
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# --------------------------------------------- OpenFeign (ms-ofertas)
# Timeouts curtos: se o ms-ofertas travar, o fallback responde rápido
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# ----------------------------------------- Circuit Breaker (Resilience4j)
# Instância "ms-ofertas" usada pelo @CircuitBreaker do ResgateController
resilience4j.circuitbreaker.instances.ms-ofertas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ms-ofertas.sliding-window-size=3
resilience4j.circuitbreaker.instances.ms-ofertas.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.ms-ofertas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-ofertas.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.ms-ofertas.permitted-number-of-calls-in-half-open-state=2
# 404/409 do ms-ofertas são respostas de negócio: não contam como falha
resilience4j.circuitbreaker.instances.ms-ofertas.ignore-exceptions=br.com.fiap.ms_resgates.exceptions.ResourceNotFoundException,br.com.fiap.ms_resgates.exceptions.RegraNegocioException

# ------------------------------------------------------ Swagger / OpenAPI
# Respeita os cabeçalhos X-Forwarded-* do API Gateway (Swagger via 8082)
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
