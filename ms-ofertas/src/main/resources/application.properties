spring.application.name=ms-ofertas
spring.profiles.active=dev
spring.jpa.open-in-view=false

# Porta aleatória -> permite subir múltiplas instâncias (Load Balancer)
server.port=0

# ---------------------------------------------------------------- Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
# Registra a instância pelo IP (evita falha de DNS do hostname da máquina no Gateway/Feign)
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ------------------------------------------------------ Swagger / OpenAPI
# Respeita os cabeçalhos X-Forwarded-* do API Gateway (Swagger via 8082)
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
